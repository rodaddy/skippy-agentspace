name: Tests & Evals
# Runs structural assertions and bats test suite
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  structural-evals:
    runs-on: [self-hosted, skippy]
    steps:
      - uses: actions/checkout@v4

      - name: Run structural eval suite
        run: bash evals/structural/runner.sh

  bats-tests:
    runs-on: [self-hosted, skippy]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Run bats tests
        run: ./tests/bats/bin/bats tests/
